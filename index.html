<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B0F1A">
<title>מלכת הנישנושים</title>
<!-- הגופן ארוז בתוך המשחק (Heebo 400/700). heebo.css נוצר מ-tools/build_fonts.py -->
<link rel="stylesheet" href="assets/fonts/heebo.css">
<link rel="stylesheet" href="css/ui.css">
</head>
<body>
<!-- במה קבועה 1440×810 (= העולם 480×270 ×3), מוקטנת/מוגדלת למסך -->
<div id="stage">
  <canvas id="world" width="480" height="270"></canvas>
  <div id="ui"></div>
  <div id="pad" hidden>
    <div class="stick"><i class="u"></i><i class="r"></i><i class="d"></i><i class="l"></i></div>
    <div class="btn a">A</div>
    <div class="btn b">B</div>
  </div>
  <div id="toast" class="panel" hidden></div>
  <div id="fade"></div>
  <div id="loading">טוען…</div>
</div>
<div id="rotate"><span id="rotateIcon"></span><div>סובבי את הטלפון לרוחב</div></div>

<!-- סדר הטעינה חשוב: אייקונים ומנוע קודם, אחר כך המסכים, ובסוף main -->
<script src="js/icons.js"></script>
<script src="js/art-data.js"></script>
<script src="js/engine.js"></script>
<script src="js/save.js"></script>
<script src="js/ui.js"></script>
<script src="js/walk.js"></script>
<script src="js/phone.js"></script>
<script src="js/scenes/title.js"></script>
<script src="js/scenes/intro.js"></script>
<script src="js/scenes/kitchen.js"></script>
<script src="js/scenes/world1.js"></script>
<script src="js/scenes/battle.js"></script>
<script src="js/main.js"></script>
</body>
</html>
