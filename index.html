<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1230">
<title>מלכת הנישנושים</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #1b1230; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #game {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #rotate {
    display: none; position: fixed; inset: 0; background: #1b1230; color: #FFF4E0;
    font-family: "Rubik", "Arial Hebrew", Arial, sans-serif; text-align: center;
    flex-direction: column; align-items: center; justify-content: center; gap: 16px; font-size: 22px;
  }
  #rotate .phone { font-size: 64px; animation: turn 1.6s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate"><div class="phone">📱</div><div>סובבי את הטלפון לרוחב</div></div>

<!-- סדר הטעינה חשוב: המנוע קודם, אחר כך המסכים, ובסוף main -->
<script src="js/engine.js"></script>
<script src="js/save.js"></script>
<script src="js/ui.js"></script>
<script src="js/phone.js"></script>
<script src="js/scenes/title.js"></script>
<script src="js/scenes/testroom.js"></script>
<script src="js/main.js"></script>
</body>
</html>
